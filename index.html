<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finish the puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #141414;
    --panel: #1c1c1c;
    --line: #e9e9e9;
    --dim: #8a8a8a;
    --accent: #f2f2f2;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--line);
    font-family: 'Kalam', cursive;
    min-height:100vh;
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 24px 16px 60px;
  }

  .header-img{
    width: min(760px, 92vw);
    height:auto;
    display:block;
    margin-bottom: 30px;
    user-select:none;
    -webkit-user-drag:none;
  }

  .puzzle-area{
    display:flex;
    gap: 32px;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
    width:100%;
    max-width: 1000px;
  }

  /* ---------- BOARD ---------- */
  .board-wrap{
    position:relative;
    width: min(520px, 88vw);
    aspect-ratio: 1754/1749;
    flex-shrink:0;
    touch-action:none;
  }
  .board-wrap img.board-bg{
    width:100%;
    height:100%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .target{
    position:absolute;
    width: 12.5%;
    height: 12.5%;
  }
  .target img.placed-piece{
    width:100%;
    height:100%;
    display:none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  .target.filled img.placed-piece{ display:block; }
  .target.flash-wrong{
    animation: flashWrong .45s ease;
    border-radius: 6px;
  }
  @keyframes flashWrong{
    0%{ box-shadow: inset 0 0 0 3px rgba(255,90,90,0); background: rgba(255,80,80,0); }
    30%{ box-shadow: inset 0 0 0 3px rgba(255,90,90,.9); background: rgba(255,80,80,.18); }
    100%{ box-shadow: inset 0 0 0 3px rgba(255,90,90,0); background: rgba(255,80,80,0); }
  }
  .target.flash-right{
    animation: flashRight .5s ease;
    border-radius: 6px;
  }
  @keyframes flashRight{
    0%{ box-shadow: inset 0 0 0 3px rgba(120,255,150,0); }
    30%{ box-shadow: inset 0 0 0 3px rgba(120,255,150,.9); }
    100%{ box-shadow: inset 0 0 0 3px rgba(120,255,150,0); }
  }

  /* ---------- OPTIONS PANEL ---------- */
  .side-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    width: 176px;
    flex-shrink:0;
  }
  .options-grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width:100%;
  }
  .option-slot{
    position:relative;
    width:100%;
    aspect-ratio: 217/221;
    background: rgba(255,255,255,.03);
    border-radius: 10px;
  }
  .option{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    cursor:grab;
    touch-action:none;
    user-select:none;
    -webkit-user-drag:none;
    transition: opacity .15s ease, transform .15s ease;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.5));
  }
  .option.dragging{
    position:fixed;
    z-index:999;
    cursor:grabbing;
    transition:none;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
    pointer-events:none;
  }
  .option.used{
    opacity:0;
    pointer-events:none;
  }
  .option:active{ cursor:grabbing; }

  .result-badge{
    width: 150px;
    height:auto;
    opacity:0;
    transform: translateY(-6px) scale(.92);
    transition: opacity .18s ease, transform .18s ease;
    pointer-events:none;
  }
  .result-badge.show{
    opacity:1;
    transform: translateY(0) scale(1);
  }

  /* ---------- CHAT BOX ---------- */
  .chat-wrap{
    position:relative;
    width: min(760px, 92vw);
    margin-top: 40px;
    aspect-ratio: 2471/476;
  }
  .chat-wrap img.chat-bg{
    width:100%;
    height:100%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .chat-content{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6% 6.5% 6% 6.5%;
    gap: 3%;
  }
  .chat-text{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
  }
  .chat-name{
    font-family:'Patrick Hand', cursive;
    font-size: clamp(16px, 2.6vw, 26px);
    color: var(--accent);
    margin: 0 0 6px 0;
  }
  .chat-message{
    font-family:'Patrick Hand', cursive;
    font-size: clamp(13px, 2vw, 19px);
    color: var(--dim);
    margin: 50px 50px 0 0;
    line-height:1.35;
    transition: opacity .12s ease;
  }
  .chat-cat{
    width: clamp(70px, 12vw, 120px);
    height:auto;
    flex-shrink:0;
    display:none;
    user-select:none;
    -webkit-user-drag:none;
    transform-origin: 50% 85%;
  }
  .chat-cat.show{ display:block; }

  .chat-cat.nod-correct{
    animation: nodCorrect .7s ease;
  }
  @keyframes nodCorrect{
    0%   { transform: rotate(0deg) translateY(0); }
    20%  { transform: rotate(6deg) translateY(2px); }
    40%  { transform: rotate(-3deg) translateY(0); }
    60%  { transform: rotate(4deg) translateY(1px); }
    80%  { transform: rotate(-1deg) translateY(0); }
    100% { transform: rotate(0deg) translateY(0); }
  }

  .chat-cat.shake-incorrect{
    animation: shakeIncorrect .5s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes shakeIncorrect{
    0%   { transform: rotate(0deg); }
    10%  { transform: rotate(-14deg); }
    20%  { transform: rotate(12deg); }
    30%  { transform: rotate(-16deg); }
    40%  { transform: rotate(14deg); }
    50%  { transform: rotate(-10deg); }
    60%  { transform: rotate(9deg); }
    70%  { transform: rotate(-7deg); }
    80%  { transform: rotate(5deg); }
    90%  { transform: rotate(-3deg); }
    100% { transform: rotate(0deg); }
  }

  .hint{
    max-width: min(760px, 92vw);
    text-align:center;
    color: var(--dim);
    font-family:'Patrick Hand', cursive;
    font-size: 14px;
    margin-top: 14px;
    line-height:1.5;
  }

  .reset-btn{
    margin-top: 18px;
    background: transparent;
    border: 1.5px solid var(--dim);
    color: var(--line);
    font-family:'Patrick Hand', cursive;
    font-size: 15px;
    padding: 8px 18px;
    border-radius: 8px;
    cursor:pointer;
  }
  .reset-btn:hover{ border-color: var(--accent); }

  @media (max-width: 640px){
    .puzzle-area{ flex-direction:column; align-items:center; }
    .side-col{ width: min(360px, 88vw); }
    .options-grid{ grid-template-columns: repeat(5, 1fr); }
  }

  /* ---------- SCENES (post-puzzle sequence) ---------- */
  #puzzleScene{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    opacity:1;
    transition: opacity .9s ease;
  }

  .scene{
    display:none;
    position:fixed;
    inset:0;
    background: var(--bg);
    z-index: 500;
    opacity:0;
    transition: opacity .9s ease;
    align-items:center;
    justify-content:center;
  }
  .scene.active{ opacity:1; }

  #chessScene img{
    width: min(900px, 92vw);
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }

  #letterScene{
    flex-direction:column;
  }
  .letter-scroll{
    width:100%;
    height:100%;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 60px 16px 90px;
    scroll-behavior:smooth;
  }
  .letter-img{
    width: min(560px, 88vw);
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    display:block;
  }
  .scroll-hint{
    color: var(--dim);
    font-family:'Patrick Hand', cursive;
    font-size: 14px;
    margin-top: 16px;
    opacity:.8;
    animation: bobHint 1.6s ease-in-out infinite;
  }
  @keyframes bobHint{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(6px); }
  }
  .congrats-img{
    width: min(520px, 86vw);
    height:auto;
    margin-top: 50px;
    user-select:none;
    -webkit-user-drag:none;
    opacity:0;
    transform: translateY(18px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .congrats-img.show{
    opacity:1;
    transform: translateY(0);
  }
</style>
</head>
<body>

  <div id="puzzleScene">

    <img class="header-img" src="assets/header.svg" alt="Finish the puzzle below">

    <div class="puzzle-area">
      <div class="board-wrap" id="boardWrap">
        <img class="board-bg" src="assets/board.svg" alt="Puzzle board" draggable="false">
        <!-- 10 target squares, position set via JS from data-col/data-row -->
        <div class="target" data-target="a8" data-col="0" data-row="0" data-answer="option-1">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="b7" data-col="1" data-row="1" data-answer="option-2">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="f7" data-col="5" data-row="1" data-answer="option-9">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="d6" data-col="3" data-row="2" data-answer="option-6">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="e5" data-col="4" data-row="3" data-answer="option-5">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="g5" data-col="6" data-row="3" data-answer="option-4">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="a4" data-col="0" data-row="4" data-answer="option-10">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="f4" data-col="5" data-row="4" data-answer="option-7">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="g4" data-col="6" data-row="4" data-answer="option-8">
          <img class="placed-piece" alt="">
        </div>
        <div class="target" data-target="f3" data-col="5" data-row="5" data-answer="option-3">
          <img class="placed-piece" alt="">
        </div>
      </div>

      <div class="side-col">
        <div class="options-grid" id="optionsGrid">
          <!-- filled by JS -->
        </div>
        <img class="result-badge" id="resultBadge" src="" alt="">
      </div>
    </div>

    <p class="hint">Drag each piece from the tray onto the square you think it belongs on.</p>

    <div class="chat-wrap">
      <img class="chat-bg" src="assets/chat-box.svg" alt="">
      <div class="chat-content">
        <div class="chat-text">
          <p class="chat-message" id="chatMessage">( a message will pop up here )</p>
        </div>
        <img class="chat-cat" id="chatCat" src="" alt="">
      </div>
    </div>

    <button class="reset-btn" id="resetBtn">Reset puzzle</button>

  </div>

  <!-- Scene 2: chess match -->
  <div class="scene" id="chessScene">
    <img src="assets/chess-match.svg" alt="Chess match">
  </div>

  <!-- Scene 3: letter (scrollable), congrats reveals at the bottom -->
  <div class="scene" id="letterScene">
    <div class="letter-scroll" id="letterScroll">
      <img class="letter-img" src="assets/letter.svg" alt="Letter">
      <p class="scroll-hint" id="scrollHint">keep scrolling...</p>
      <img class="congrats-img" id="congratsImg" src="assets/congrats.svg" alt="Congrats">
    </div>
  </div>

<script>
(function(){
  const DEFAULT_MESSAGE = "check the chess.com game for your history play with Quan, or randomly finish the puzzle by guessing — that'll be more impressive.";

  const CORRECT_MESSAGES = [
    "Did you check your chess history for this?",
    "Thats the place.",
    "Took you long enough.",
    "impressive memory.",
    "Good.",
    "Not bad.",
    "Guessed that right.",
    "Yes.",
    "Easy for you to remember the round i lost.",
    "Nice work."
  ];
  const INCORRECT_MESSAGES = [
    "Try Harder",
    "Wrong place",
    "I didnt even bother to delete the grid color and you still got it wrong?",
    "Not right there.",
    "Think again.",
    "Have you slept?",
    "Do that again i dare you.",
    "Retract that move.",
    "Whatever your instincts tells you huh.",
    "That Troubled?"
  ];

  // avoid repeating the same line twice in a row
  function pickMessage(arr, lastIdxRef){
    if(arr.length === 1) return arr[0];
    let idx;
    do{ idx = Math.floor(Math.random() * arr.length); } while(idx === lastIdxRef.v);
    lastIdxRef.v = idx;
    return arr[idx];
  }
  const lastCorrectRef = { v:-1 };
  const lastIncorrectRef = { v:-1 };

  // option id -> src path
  const OPTIONS = ["option-1","option-2","option-3","option-4","option-5",
                    "option-6","option-7","option-8","option-9","option-10"];

  const optionsGrid = document.getElementById('optionsGrid');
  const resultBadge = document.getElementById('resultBadge');
  const chatMessage = document.getElementById('chatMessage');
  const chatCat = document.getElementById('chatCat');
  const resetBtn = document.getElementById('resetBtn');

  const puzzleScene = document.getElementById('puzzleScene');
  const chessScene = document.getElementById('chessScene');
  const letterScene = document.getElementById('letterScene');
  const letterScroll = document.getElementById('letterScroll');
  const congratsImg = document.getElementById('congratsImg');
  const scrollHint = document.getElementById('scrollHint');

  const targets = Array.from(document.querySelectorAll('.target'));

  function layoutTargets(){
    targets.forEach(t=>{
      const col = parseInt(t.dataset.col,10);
      const row = parseInt(t.dataset.row,10);
      t.style.left = (col*12.5) + '%';
      t.style.top = (row*12.5) + '%';
    });
  }
  layoutTargets();

  // Build option tray
  function buildOptions(){
    optionsGrid.innerHTML = '';
    OPTIONS.forEach(id=>{
      const slot = document.createElement('div');
      slot.className = 'option-slot';
      const img = document.createElement('img');
      img.className = 'option';
      img.src = 'assets/' + id + '.svg';
      img.draggable = false;
      img.dataset.option = id;
      img.alt = id;
      slot.appendChild(img);
      optionsGrid.appendChild(slot);
    });
    attachDragHandlers();
  }

  function resetChat(){
    chatMessage.textContent = "( a message will pop up here )";
    chatCat.classList.remove('show','nod-correct','shake-incorrect');
    chatCat.src = '';
  }

  function showResult(correct){
    // instantly swap and re-trigger the entry animation
    resultBadge.classList.remove('show');
    // force reflow so the transition restarts even if it was already shown
    void resultBadge.offsetWidth;
    resultBadge.src = correct ? 'assets/correct-result.svg' : 'assets/incorrect-result.svg';
    requestAnimationFrame(()=>{
      resultBadge.classList.add('show');
    });
  }

  function showChat(correct){
    const msg = correct
      ? pickMessage(CORRECT_MESSAGES, lastCorrectRef)
      : pickMessage(INCORRECT_MESSAGES, lastIncorrectRef);

    chatMessage.textContent = msg;
    chatCat.src = correct ? 'assets/correct-cat.svg' : 'assets/incorrect-cat.svg';
    chatCat.classList.add('show');

    // restart the animation every single time, even for consecutive same-type results
    chatCat.classList.remove('nod-correct','shake-incorrect');
    void chatCat.offsetWidth; // force reflow to reset animation
    chatCat.classList.add(correct ? 'nod-correct' : 'shake-incorrect');
  }

  // ---------- End-of-puzzle scene sequence ----------
  let sequenceStarted = false;

  function delay(ms){ return new Promise(res => setTimeout(res, ms)); }

  function showScene(scene){
    scene.style.display = 'flex';
    // force reflow before adding active so the opacity transition actually runs
    void scene.offsetWidth;
    scene.classList.add('active');
  }

  function hideScene(scene){
    scene.classList.remove('active');
    return delay(900).then(()=>{ scene.style.display = 'none'; });
  }

  function checkLetterScrollEnd(){
    const nearBottom = letterScroll.scrollTop + letterScroll.clientHeight >= letterScroll.scrollHeight - 40;
    if(nearBottom){
      congratsImg.classList.add('show');
      scrollHint.style.opacity = '0';
    }
  }

  async function playEndSequence(){
    if(sequenceStarted) return;
    sequenceStarted = true;

    await delay(1400); // let the last "correct" feedback register first

    puzzleScene.style.opacity = '0';
    await delay(900);
    puzzleScene.style.display = 'none';

    showScene(chessScene);
    await delay(900);   // let it finish fading in
    await delay(3500);  // hold on screen

    await hideScene(chessScene);
    showScene(letterScene);
    await delay(900);

    // in case the letter already fits without scrolling on tall screens
    checkLetterScrollEnd();
    letterScroll.addEventListener('scroll', checkLetterScrollEnd);
  }

  function checkComplete(){
    const allFilled = targets.every(t=>t.classList.contains('filled'));
    if(allFilled){
      chatMessage.textContent = "Puzzle complete. Not that i'm impressed.";
      playEndSequence();
    }
  }

  function resetPuzzle(){
    targets.forEach(t=>{
      t.classList.remove('filled');
      const img = t.querySelector('.placed-piece');
      img.src = '';
    });
    resultBadge.classList.remove('show');
    resultBadge.src = '';
    resetChat();
    buildOptions();
  }
  resetBtn.addEventListener('click', resetPuzzle);

  // ---------- Drag logic (pointer events, works for mouse + touch) ----------
  let dragEl = null;
  let dragOptionId = null;
  let offsetX = 0, offsetY = 0;
  let originSlot = null;

  function attachDragHandlers(){
    document.querySelectorAll('.option').forEach(img=>{
      img.addEventListener('pointerdown', onPointerDown);
    });
  }

  function onPointerDown(e){
    const img = e.currentTarget;
    if(img.classList.contains('used')) return;
    e.preventDefault();
    dragEl = img;
    dragOptionId = img.dataset.option;
    originSlot = img.parentElement;

    const rect = img.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    img.classList.add('dragging');
    img.style.width = rect.width + 'px';
    img.style.height = rect.height + 'px';
    moveDragTo(e.clientX, e.clientY);

    document.body.appendChild(img); // lift above everything, fixed position

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  function moveDragTo(x, y){
    if(!dragEl) return;
    dragEl.style.left = (x - offsetX) + 'px';
    dragEl.style.top = (y - offsetY) + 'px';
  }

  function onPointerMove(e){
    moveDragTo(e.clientX, e.clientY);
  }

  function findTargetUnder(x, y){
    for(const t of targets){
      const r = t.getBoundingClientRect();
      if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom){
        return t;
      }
    }
    return null;
  }

  function clearDragStyles(el){
    el.classList.remove('dragging');
    el.style.width = '';
    el.style.height = '';
    el.style.left = '';
    el.style.top = '';
  }

  function returnToTray(){
    clearDragStyles(dragEl);
    originSlot.appendChild(dragEl);
  }

  function onPointerUp(e){
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    if(!dragEl) return;

    const dropX = e.clientX;
    const dropY = e.clientY;
    const target = findTargetUnder(dropX, dropY);

    if(target && !target.classList.contains('filled')){
      if(target.dataset.answer === dragOptionId){
        // correct placement - fire feedback FIRST, synchronously, no delay
        showResult(true);
        showChat(true);

        const pieceImg = target.querySelector('.placed-piece');
        pieceImg.src = 'assets/' + dragOptionId + '.svg';
        target.classList.add('filled');
        target.classList.add('flash-right');
        setTimeout(()=>target.classList.remove('flash-right'), 500);

        clearDragStyles(dragEl);
        dragEl.classList.add('used');
        originSlot.appendChild(dragEl);

        checkComplete();
      } else {
        // wrong square - fire feedback FIRST, synchronously, no delay
        showResult(false);
        showChat(false);

        target.classList.add('flash-wrong');
        setTimeout(()=>target.classList.remove('flash-wrong'), 450);
        returnToTray();
      }
    } else {
      // dropped outside any open target -> just return, no message
      returnToTray();
    }

    dragEl = null;
    dragOptionId = null;
    originSlot = null;
  }

  buildOptions();
})();
</script>
</body>
</html>
